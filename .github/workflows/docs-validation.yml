name: Documentation & Structure Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /docs directory and required files
        run: |
          echo "Checking repository structure..."
          test -d docs || (echo "Error: /docs directory missing" && exit 1)
          test -f docs/api-endpoint-plan.md || test -f docs/api-endpoint-plan.pdf || (echo "Error: Endpoint plan missing" && exit 1)
          test -f docs/schema.sql || (echo "Error: SQL script missing" && exit 1)
          test -f docs/erd.png || test -f docs/erd.pdf || (echo "Error: ERD file missing" && exit 1)
          echo "All required planning documents are present!"
